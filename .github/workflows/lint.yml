name: Lint

on:
  push:
  pull_request:

jobs:
  golangci:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
